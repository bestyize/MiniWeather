# Shared Gradle configuration; machine-specific SDK locations belong in local.properties.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Retained for compatibility with the project's legacy Tencent/AutoBus binaries.
# Revisit after upgrading and testing their SDK integrations.
android.enableJetifier=true
