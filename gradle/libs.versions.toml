[versions]
agp = "9.4.0"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
legacy = "1.0.0"
recyclerview = "1.4.0"
gson = "2.13.2"
okhttp = "4.12.0"
glide = "4.16.0"
material = "1.13.0"
tencentLocation = "7.2.5"
autobus = "v1.0.3"
junit = "4.13.2"
androidxTestJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-legacy = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacy" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
material = { module = "com.google.android.material:material", version.ref = "material" }
tencent-location = { module = "com.tencent.map.geolocation:TencentLocationSdk-openplatform", version.ref = "tencentLocation" }
autobus = { module = "com.github.bestyize:AutoBus", version.ref = "autobus" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
